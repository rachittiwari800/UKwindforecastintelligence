services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ELEXON_BASE_URL: ${ELEXON_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1}
      DEFAULT_CUTOFF: ${DEFAULT_CUTOFF:-11:00}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:4173"
    depends_on:
      backend:
        condition: service_healthy
